[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[functions]
  directory = "netlify/functions"

# SECURITY: with publish = "." the repo root IS the served site, so
# netlify/functions/*.js was being served as readable static source at
# /netlify/functions/<name>.js to anyone on the internet. The functions
# themselves run at /.netlify/functions/<name> (note the leading dot) and are
# unaffected by this rule. Verified 2026-09-19: these paths returned 200 with
# full source. Do not remove.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
